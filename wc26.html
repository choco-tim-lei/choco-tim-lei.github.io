<html lang="zh-CN">
<head>

<title>世界杯26 · 赛程盘口</title>
<style>
  :root{
    --turf:#0E271C;
    --turf-2:#0A1D15;
    --card:#163828;
    --card-2:#11301F;
    --chalk:#F1F6EF;
    --chalk-dim:#9DB7A8;
    --line:#2A5440;
    --flood:#FFD75E;        /* 泛光金：真盘盘口 */
    --model:#7CC4FF;        /* 模型盘 */
    --home:#FF8073;
    --away:#7CC4FF;
    --win:#3DD68C;
    --winhalf:#8FE0B4;
    --push:#C9D6CE;
    --losehalf:#F0A28C;
    --lose:#FF6B5B;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--turf-2)}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--chalk);
    background:
      radial-gradient(120% 60% at 50% -10%, #18402C 0%, var(--turf) 45%, var(--turf-2) 100%);
    min-height:100vh;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap{max-width:520px;margin:0 auto;padding:14px 14px 40px}

  /* header */
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .brand{display:flex;align-items:center;gap:9px}
  .brand h1{font-size:19px;font-weight:800;letter-spacing:.5px}
  .brand .sub{font-size:11px;color:var(--chalk-dim);font-weight:600}
  .seal{
    width:30px;height:30px;border-radius:7px;flex:none;
    display:grid;place-items:center;font-weight:900;font-size:17px;
    color:#4A2D00;background:linear-gradient(145deg,#FFE07A,#E9A800);
    box-shadow:0 1px 0 #fff6 inset,0 3px 8px #0006;
    font-family:"Songti SC","STSong",serif;
  }
  .clock{text-align:right;font-variant-numeric:tabular-nums}
  .clock .t{font-size:15px;font-weight:700;letter-spacing:.5px}
  .clock .d{font-size:10.5px;color:var(--chalk-dim)}

  .status{display:flex;align-items:center;justify-content:flex-end;gap:8px;
    font-size:11px;color:var(--chalk-dim);margin:2px 0 12px;min-height:16px}
  .status .dot{width:6px;height:6px;border-radius:50%;background:var(--win)}
  .status.err .dot{background:var(--lose)}
  .refresh{margin-left:4px;border:1px solid var(--line);background:#0000;
    color:var(--chalk-dim);border-radius:7px;padding:3px 8px;font-size:11px;cursor:pointer}
  .refresh:active{background:var(--line)}

  /* tabs */
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
  .tab{
    border:1px solid var(--line);background:var(--card-2);color:var(--chalk-dim);

    padding-top:10px;border-top:1px dashed var(--line);flex-wrap:wrap}

  .hcap.model{color:var(--model)}

function cnName(full, abbr){
  if(full && EN2CN[full]) return EN2CN[full];
  if(abbr && ABBR2CN[abbr]) return ABBR2CN[abbr];
  if(full){ // 模糊兜底
    for(const k in EN2CN){ if(full.includes(k)||k.includes(full)) return EN2CN[k]; }
  }
  return full || abbr || "?";
}
function flagOf(cn){ return FLAG[cn] || "⚽"; }

/* ===================== 时间 ===================== */
function bjOf(iso){ // 转北京时间 Date
  return new Date(iso);
}
function bjStr(iso){
  const d = new Date(iso);
  const f = new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',hour:'2-digit',minute:'2-digit',hour12:false});
  return f.format(d);
}
function bjDayKey(iso){ // 北京时间的 YYYY-MM-DD
  const d=new Date(iso);
  const f=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'});
  return f.format(d);
}
function todayBJ(offset){
  const now=new Date();
  const bj=new Date(now.getTime()+ (now.getTimezoneOffset()*60000) + 8*3600000);
  bj.setDate(bj.getDate()+offset);
  const y=bj.getFullYear(),m=String(bj.getMonth()+1).padStart(2,'0'),d=String(bj.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}
function espnDate(offset){ return todayBJ(offset).replace(/-/g,''); } // ESPN 用 YYYYMMDD（按北京日历日）

/* ===================== 盘口中文命名 ===================== */
// point 为主队让球数(负=主让, 正=主受让)。这里 spreads 的 point 直接来自 bookmaker
function lineName(homePoint){
  const p = homePoint;
  const give = p < 0;            // 主队让球
  const a = Math.abs(p);
  const NAME={0:"平手",0.25:"平手/半球",0.5:"半球",0.75:"半球/一球",1:"一球",
    1.25:"一球/球半",1.5:"球半",1.75:"球半/两球",2:"两球",2.25:"两球/两球半",2.5:"两球半",3:"三球"};
  const nm = NAME[a] !== undefined ? NAME[a] : a+"球";
  if(a===0) return "平手";
  return (give?"主让":"主受让")+nm;
}

/* ===================== 盘路计算（完成场次） ===================== */
// homePoint: 主队让球(负=让), hs/as: 主/客进球
function panResult(homePoint, hs, as){
  // 把主队让球后的净胜分 = (hs + homePoint) - as
  const diff = (hs + homePoint) - as;
  // 处理 .25/.75 半球半结算：拆成两半取平均
  const frac = Math.abs(homePoint*4)%2; // 0.25/0.75 类含 .25 余数
  let res;
  if(Math.abs(homePoint*2)%2===1){ // .5 整半球，无走盘
    res = diff>0 ? "win" : "lose";
  } else if(frac===1){ // .25 / .75 类，半赢半走 或 半输半走
    const lineLow = homePoint - 0.25, lineHigh = homePoint + 0.25;
    const dLow=(hs+lineLow)-as, dHigh=(hs+lineHigh)-as;
    const r1 = dLow>0?1:(dLow<0?-1:0);
    const r2 = dHigh>0?1:(dHigh<0?-1:0);
    const s=r1+r2;
    if(s===2)res="win"; else if(s===1)res="winhalf"; else if(s===0)res="push";
    else if(s===-1)res="losehalf"; else res="lose";
  } else { // 整数球，可能走盘
    res = diff>0?"win":(diff<0?"lose":"push");
  }
  return res;
}
const PAN_LABEL={win:"赢盘",winhalf:"赢半",push:"走盘",losehalf:"输半",lose:"输盘"};
const PAN_CLASS={win:"p-win",winhalf:"p-winhalf",push:"p-push",losehalf:"p-losehalf",lose:"p-lose"};

/* ===================== 赔率反推模型盘（兜底） ===================== */
function modelLineFromOdds(homeDec, awayDec){
  if(!homeDec||!awayDec) return null;
  const ph=1/homeDec, pa=1/awayDec;
  const r=ph/(ph+pa); // 主队相对强度 0..1
  // 经验映射到让球档（粗略，仅兜底参考）
  const table=[[.50,0],[.55,-0.25],[.60,-0.5],[.65,-0.75],[.70,-1],[.75,-1.25],[.80,-1.5],[.85,-1.75],[.90,-2]];
  let line=0;
  for(const [thr,l] of table){ if(r>=thr) line=l; }
  if(r<.45){ // 客强，主队受让
    const t2=[[.45,0.25],[.40,0.5],[.35,0.75],[.30,1],[.25,1.25],[.20,1.5]];
    for(const [thr,l] of t2){ if(r<=thr) line=l; }
  }
  return line;
}

/* ===================== 数据抓取 ===================== */
const ESPN="https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard";

async function fetchESPN(offset){
  const url=`${ESPN}?dates=${espnDate(offset)}`;
  const r=await fetch(url);
  if(!r.ok) throw new Error("ESPN "+r.status);
  const j=await r.json();
  return (j.events||[]).map(ev=>{
    const c=ev.competitions[0];
    const comp=c.competitors;
    const home=comp.find(x=>x.homeAway==="home")||comp[0];
    const away=comp.find(x=>x.homeAway==="away")||comp[1];
    const st=ev.status||c.status;
    const stType=st.type||{};
    const hcn=cnName(home.team.displayName||home.team.name, home.team.abbreviation);
    const acn=cnName(away.team.displayName||away.team.name, away.team.abbreviation);
    return {
      id:ev.id,
      iso:ev.date,
      home:hcn, away:acn,
      homeRaw:(home.team.displayName||home.team.name),
      awayRaw:(away.team.displayName||away.team.name),
      hs:home.score!=null?parseInt(home.score):null,
      as:away.score!=null?parseInt(away.score):null,
      state:stType.state,                       // pre / in / post
      detail:stType.shortDetail||stType.description||"",
      group:(ev.season&&ev.groupings)?"":"",
      venue:(c.venue&&c.venue.fullName)||""
    };
  });
}

// 拉一次全量世界杯赔率，建立 "homeRaw|awayRaw" -> spreads 索引
let ODDS_INDEX=null, ODDS_FETCHED_AT=0;
async function fetchOdds(){
  if(!ODDS_API_KEY) return null;
  if(ODDS_INDEX && Date.now()-ODDS_FETCHED_AT < 60000) return ODDS_INDEX; // 1分钟缓存省额度
  const url=`https://api.the-odds-api.com/v4/sports/soccer_fifa_world_cup/odds`
    +`?regions=${ODDS_REGION}&markets=h2h,spreads&oddsFormat=decimal&apiKey=${ODDS_API_KEY}`;
  const r=await fetch(url);
  if(!r.ok) throw new Error("ODDS "+r.status);
  const arr=await r.json();
  const idx={};
  for(const ev of arr){
    const key=ev.home_team+"|"+ev.away_team;
    // 选基准 bookmaker
    let chosen=null;
    for(const pref of BOOK_PRIORITY){
      const b=ev.bookmakers.find(x=>x.key===pref && x.markets.some(m=>m.key==="spreads"));
      if(b){chosen=b;break;}
    }
    if(!chosen) chosen=ev.bookmakers.find(x=>x.markets.some(m=>m.key==="spreads"));
    let spreads=null, h2h=null;
    const anyH2H=(chosen||ev.bookmakers[0]);
    if(anyH2H){
      const m=anyH2H.markets.find(m=>m.key==="h2h");
      if(m) h2h={};
    }
    // h2h 取任意一家
    for(const b of ev.bookmakers){
      const m=b.markets.find(m=>m.key==="h2h");
      if(m){ h2h={}; for(const o of m.outcomes){ h2h[o.name]=o.price; } break; }
    }
    if(chosen){
      const m=chosen.markets.find(m=>m.key==="spreads");
      if(m){
        const ho=m.outcomes.find(o=>o.name===ev.home_team);
        const ao=m.outcomes.find(o=>o.name===ev.away_team);
        if(ho&&ao){ spreads={ homePoint:ho.point, homeOdd:ho.price, awayOdd:ao.price, book:chosen.title }; }
      }
    }
    idx[key]={home:ev.home_team,away:ev.away_team,spreads,h2h};
  }
  ODDS_INDEX=idx; ODDS_FETCHED_AT=Date.now();
  return idx;
}

// 名字匹配（ESPN 名 vs OddsAPI 名 可能略不同）
function matchOdds(idx, homeRaw, awayRaw){
  if(!idx) return null;
  const norm=s=>(s||"").toLowerCase().replace(/[^a-z]/g,"");
  const hr=norm(homeRaw), ar=norm(awayRaw);
  for(const k in idx){
    const e=idx[k];
    const eh=norm(e.home), ea=norm(e.away);
    const hit = (eh.includes(hr)||hr.includes(eh)) && (ea.includes(ar)||ar.includes(ea));
    const swap= (eh.includes(ar)||ar.includes(eh)) && (ea.includes(hr)||hr.includes(ea));
    if(hit) return {data:e,swapped:false};
    if(swap) return {data:e,swapped:true};
  }
  return null;
}

/* ===================== 渲染 ===================== */
let CUR=1; // tab: 0昨 1今 2明 3后
const TABS=[{o:-1,t:"昨天"},{o:0,t:"今天"},{o:1,t:"明天"},{o:2,t:"后天"}];

function renderTabs(){
  const box=document.getElementById('tabs'); box.innerHTML='';
  TABS.forEach((tb,i)=>{
    const el=document.createElement('div');
    el.className='tab'+(i===CUR?' on':'');
    const dk=todayBJ(tb.o).slice(5).replace('-','/');
    el.innerHTML=`${tb.t}<span class="n">${dk}</span>`;
    el.onclick=()=>{CUR=i;renderTabs();load();};
    box.appendChild(el);
  });
}

function oddsBlock(m, oddsHit){
  // 优先真盘
  if(oddsHit && oddsHit.data.spreads){
    let {homePoint,homeOdd,awayOdd,book}=oddsHit.data.spreads;
    if(oddsHit.swapped){ homePoint=-homePoint; const t=homeOdd;homeOdd=awayOdd;awayOdd=t; }
    return {homePoint, html:`
      <span class="hcap">${lineName(homePoint)}</span>
      <span class="od">主 <b>${homeOdd?.toFixed(2)||'-'}</b></span>
      <span class="od">客 <b>${awayOdd?.toFixed(2)||'-'}</b></span>
      <span class="tag real">真盘</span>
      <span class="book">${book||''}</span>`, real:true};
  }
  // 兜底 h2h 反推模型盘
  let hd=null,ad=null;
  if(oddsHit && oddsHit.data.h2h){
    const h=oddsHit.data.h2h;
    hd=h[oddsHit.data.home]; ad=h[oddsHit.data.away];
    if(oddsHit.swapped){ const t=hd;hd=ad;ad=t; }
  }
  const ml=modelLineFromOdds(hd,ad);
  if(ml!==null){
    return {homePoint:ml, html:`
      <span class="hcap model">${lineName(ml)}</span>
      <span class="od">主 <b>${hd?hd.toFixed(2):'-'}</b></span>
      <span class="od">客 <b>${ad?ad.toFixed(2):'-'}</b></span>
      <span class="tag">模型盘</span>`, real:false};
  }
  return {homePoint:null, html:`<span class="od">盘口待更新</span>`, real:false};
}

function card(m, idx){
  const oddsHit=matchOdds(idx, m.homeRaw, m.awayRaw);
  const ob=oddsBlock(m, oddsHit);

  let scoreMid, crowRight;
  if(m.state==="post"){
    scoreMid=`<div class="sc">${m.hs} - ${m.as}</div><div class="kt">完场</div>`;
    crowRight=`<span>${bjStr(m.iso)}</span>`;
  } else if(m.state==="in"){
    scoreMid=`<div class="sc">${m.hs} - ${m.as}</div><div class="kt">${m.detail}</div>`;
    crowRight=`<span class="live">LIVE</span>`;
  } else {
    scoreMid=`<div class="vs">VS</div><div class="kt">${bjStr(m.iso)}</div>`;
    crowRight=`<span>${bjStr(m.iso)} 开球</span>`;
  }

  // 盘路（完成 + 有盘口）
  let resultHTML="";
  if(m.state==="post" && ob.homePoint!==null && m.hs!=null && m.as!=null){
    const pr=panResult(ob.homePoint, m.hs, m.as);
    resultHTML=`<div class="result">
      <span class="reslbl">${lineName(ob.homePoint)} 盘路</span>
      <span class="pill ${PAN_CLASS[pr]}">${PAN_LABEL[pr]}</span>
      ${ob.real?'':'<span class="tag">基于模型盘</span>'}
    </div>`;
  }

  const el=document.createElement('div');
  el.className='card';
  el.innerHTML=`
    <div class="crow">
      <span class="grp">${m.venue?m.venue.split(',')[0]:'World Cup'}</span>
      ${crowRight}
    </div>
    <div class="teams">
      <div class="team"><div class="flag">${flagOf(m.home)}</div><div class="nm">${m.home}</div></div>
      <div class="mid">${scoreMid}</div>
      <div class="team"><div class="flag">${flagOf(m.away)}</div><div class="nm">${m.away}</div></div>
    </div>
    <div class="odds">${ob.html}</div>
    ${resultHTML}`;
  return el;
}

function setStatus(txt, err){
  const s=document.getElementById('status'); s.classList.toggle('err',!!err);
  document.getElementById('stxt').textContent=txt;
}

async function load(){
  const list=document.getElementById('list');
  list.innerHTML='<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  setStatus('加载中…');
  try{
    const offset=TABS[CUR].o;
    let idx=null;
    try{ idx=await fetchOdds(); }
    catch(e){ console.warn('odds fail',e); /* 赔率失败不阻塞，走模型盘/待更新 */ }
    const matches=await fetchESPN(offset);
    matches.sort((a,b)=>new Date(a.iso)-new Date(b.iso));
    list.innerHTML='';
    if(!matches.length){ list.innerHTML='<div class="day-empty">这一天没有比赛安排</div>'; }
    else matches.forEach(m=>list.appendChild(card(m, idx)));
    const now=new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date());
    const oddsNote = ODDS_API_KEY ? (idx?'真盘已接':'赔率源异常·暂用模型盘') : '未填赔率key·暂用模型盘';
    setStatus(`已更新 ${now} · ${oddsNote}`);
  }catch(e){
    list.innerHTML='<div class="day-empty">数据加载失败，点刷新重试<br><span style="opacity:.6">'+e.message+'</span></div>';
    setStatus('加载失败',true);
  }
}

/* ===================== 时钟 & key 提醒 ===================== */
function tick(){
  const now=new Date();
  const t=new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(now);
  const d=new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'long',day:'numeric',weekday:'short'}).format(now);
  document.getElementById('clk').textContent=t;
  document.getElementById('cdt').textContent=d;
}
function keyWarn(){
  if(!ODDS_API_KEY){
    document.getElementById('keywarn').innerHTML=
      '<div class="warn">⚠ 还没填 The Odds API key，当前盘口走「模型盘」(赔率反推)。'
      +'在源码顶部 <b>ODDS_API_KEY</b> 填入你的 key 即可显示真实让球盘。</div>';
  }
}

document.getElementById('refresh').onclick=load;
keyWarn();
renderTabs();
tick(); setInterval(tick,1000);
load();
setInterval(()=>{ if(document.visibilityState==='visible') load(); }, 90000); // 90秒自动刷新
</script>
